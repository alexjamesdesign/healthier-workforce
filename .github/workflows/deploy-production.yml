name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        default: ''

jobs:
  validate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "You must type DEPLOY to confirm. Aborting."
          exit 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to production via FTPS
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USER: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          lftp -c "
            set ssl:verify-certificate false;
            set ftp:ssl-force true;
            set ftp:passive-mode true;
            set ssl:priority 'NORMAL:-VERS-TLS1.3:-VERS-TLS1.1:-VERS-TLS1.0:+VERS-TLS1.2';
            set net:timeout 30;
            set net:max-retries 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_SERVER:21;
            mirror -R --delete --verbose \
              --exclude uploads/ \
              --exclude ai1wm-backups/ \
              ./wp-content/ /wp-content/;
            bye
          "
