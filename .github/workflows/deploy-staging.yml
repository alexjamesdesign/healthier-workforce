name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 $SSH_HOST >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
            "mkdir -p /home/u970633187/domains/staging.alexjamesstudio.com/public_html/hw"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            --exclude .git/ \
            --exclude .github/ \
            --exclude wp-content/uploads/ \
            --exclude wp-content/ai1wm-backups/ \
            --exclude wp-config.php \
            ./ \
            $SSH_USER@$SSH_HOST:/home/u970633187/domains/staging.alexjamesstudio.com/public_html/hw/

      - name: Password protect staging
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          AUTH_USER: ${{ secrets.STAGING_AUTH_USER }}
          AUTH_PASS: ${{ secrets.STAGING_AUTH_PASS }}
        run: |
          HTPASSWD_HASH=$(htpasswd -nb "$AUTH_USER" "$AUTH_PASS")
          HTPASSWD_FILE="/home/u970633187/.htpasswd_staging"
          HTACCESS_FILE="/home/u970633187/domains/staging.alexjamesstudio.com/public_html/hw/.htaccess"

          ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
            "echo '$HTPASSWD_HASH' > $HTPASSWD_FILE && \
             sed -i '/# BEGIN staging-auth/,/# END staging-auth/d' $HTACCESS_FILE && \
             printf '# BEGIN staging-auth\nAuthType Basic\nAuthName \"Staging Environment\"\nAuthUserFile $HTPASSWD_FILE\nRequire valid-user\n# END staging-auth\n' | cat - $HTACCESS_FILE > /tmp/.htaccess_tmp && mv /tmp/.htaccess_tmp $HTACCESS_FILE"
